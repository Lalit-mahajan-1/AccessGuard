services:
  server:
    build:
      context: ./server
    environment:
      PORT: 3001
      NODE_ENV: production
    ports:
      - "3001:3001"
    volumes:
      - reports:/app/public/reports
    restart: unless-stopped

  client:
    build:
      context: ./client
      args:
        NEXT_PUBLIC_API_URL: http://localhost:3001/api
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: http://localhost:3001/api
    ports:
      - "3000:3000"
    depends_on:
      - server
    restart: unless-stopped

volumes:
  reports:
